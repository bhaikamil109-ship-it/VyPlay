plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystoreProperties['storeFile']
        ? file(keystoreProperties['storeFile'])
        : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

 
// PipePipe's FFmpegKit build is shipped as a pinned AAR. Download it at build
// time rather than committing a 33 MB binary. Verify the Git blob SHA before
// Gradle is allowed to package it.
def pipePipeFfmpegAarFile = layout.buildDirectory.file('pipepipe-ffmpeg/ffmpeg-kit.aar').get().asFile
def pipePipeFfmpegAarBlobSha = '27ae421b634123feb5853d41f0fb5ec8494a3acb'
def pipePipeFfmpegAarUrl = 'https://raw.githubusercontent.com/InfinityLoop1308/PipePipeClient/b91f008fb4d25b470c4383dcf42e31ee7696d272/ffmpeg/ffmpeg-kit.aar'

def calculateGitBlobSha = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-1')
    digest.update(("blob ${file.length()}\\0").getBytes('UTF-8'))
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = input.read(buffer)) > 0) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def downloadPipePipeFfmpegAar = tasks.register('downloadPipePipeFfmpegAar') {
    outputs.file(pipePipeFfmpegAarFile)
    doLast {
        pipePipeFfmpegAarFile.parentFile.mkdirs()
        if (pipePipeFfmpegAarFile.exists() &&
                calculateGitBlobSha(pipePipeFfmpegAarFile) == pipePipeFfmpegAarBlobSha) {
            logger.lifecycle('Using verified PipePipe FFmpegKit AAR')
            return
        }

        File temporary = new File(pipePipeFfmpegAarFile.parentFile, 'ffmpeg-kit.aar.part')
        temporary.delete()
        def connection = new URL(pipePipeFfmpegAarUrl).openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.setRequestProperty('User-Agent', 'VyPlay-Gradle')
        connection.getInputStream().withCloseable { input ->
            temporary.withOutputStream { output -> input.transferTo(output) }
        }

        def actualSha = calculateGitBlobSha(temporary)
        if (actualSha != pipePipeFfmpegAarBlobSha) {
            temporary.delete()
            throw new GradleException(
                    "PipePipe FFmpegKit AAR integrity check failed: expected ${pipePipeFfmpegAarBlobSha}, got ${actualSha}"
            )
        }
        if (pipePipeFfmpegAarFile.exists() && !pipePipeFfmpegAarFile.delete()) {
            temporary.delete()
            throw new GradleException('Could not replace the existing PipePipe FFmpegKit AAR')
        }
        if (!temporary.renameTo(pipePipeFfmpegAarFile)) {
            temporary.delete()
            throw new GradleException('Could not move the verified PipePipe FFmpegKit AAR into the Gradle build directory')
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any { task ->
        task.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (buildingRelease && !hasReleaseKeystore) {
        throw new IllegalStateException(
                "Release keystore is missing. Check android/key.properties storeFile; " +
                        "paths are resolved from android/app. For android/app/key.jks use storeFile=key.jks."
        )
    }
}

android {
    namespace "com.kamil.vyplay"
    compileSdk flutter.compileSdkVersion
    // No NDK is pinned on purpose. This project compiles no native code: there
    // is no CMakeLists.txt, no externalNativeBuild block, and no plugin in the
    // dependency set ships one — every .so arrives prebuilt inside its AAR.
    // Pinning `ndkVersion flutter.ndkVersion` made AGP download a ~2.5 GB NDK
    // that was never used, which is what broke the build on a disk-constrained
    // machine. Without it AGP simply packages the native libraries unstripped
    // (a size warning, not an error). Re-add the pin if native code is ever
    // introduced.

    compileOptions {
        // Enable core library desugaring for NewPipe Extractor (requires Java 8+ APIs on older Android)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fazilvk.fluxtube"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // Keep the Android compatibility floor aligned with the tested app baseline.
        minSdkVersion 24
        // Play Store requires targetSdk 35 for new submissions from 2025.
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile releaseStoreFile
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Per-ABI APKs are requested from the Flutter tool with
    // `flutter build apk --split-per-abi`, NOT from a Gradle `splits` block.
    // A Gradle splits block makes AGP emit only app-<abi>-<type>.apk and skip
    // the default app-<type>.apk; the flutter tool looks for that default name
    // in build/app/outputs/flutter-apk/ and, not finding it, fails the build
    // with "Gradle build failed to produce an .apk file" even though Gradle
    // itself succeeded. Letting the tool drive splitting keeps the artifact
    // names and locations exactly what the tool expects.

    packaging {
        jniLibs {
            // Keep native libraries compressed in APKs. This keeps release
            // artifacts small enough for stores with strict APK size limits.
            useLegacyPackaging = true
            // Keep every .so exactly as its AAR ships it. AGP strips native
            // libraries by default, and stripping is the one build step that
            // requires the NDK — which is a ~2.5 GB download this project has no
            // other use for (it compiles no native code of its own). The cost is
            // a few MB of unstripped symbols in the APK; the benefit is a build
            // that works without the NDK installed.
            keepDebugSymbols += ["**/*.so"]
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    lint {
        // Disable NullSafeMutableLiveData lint check that crashes with newer Kotlin/Gradle versions
        // This is a known issue with the androidx.lifecycle.lint detector
        disable "NullSafeMutableLiveData"
        // Don't abort build on lint errors (issues are in third-party plugins)
        abortOnError false
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:2.4.10")

    // Core library desugaring for NewPipe Extractor (Java 8+ APIs on older Android)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.3'

    // NewPipe Extractor - YouTube data extraction library (lowercase required for JitPack)
    // PipePipe Extractor adds the Bilibili service/API alongside the existing YouTube API.
    implementation 'com.github.InfinityLoop1308.PipePipeExtractor:extractor:v5.5.0'
    // PipePipe FFmpegKit, pinned to an upstream commit and SHA-1 verified above.
    implementation files(pipePipeFfmpegAarFile).builtBy(downloadPipePipeFfmpegAar)
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    // OkHttp - Required by NewPipe Extractor for HTTP requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson - JSON serialization for Flutter communication
    implementation 'com.google.code.gson:gson:2.11.0'

    // Kotlin Coroutines - Async operations for background extraction
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Storage Access Framework: DocumentFile wraps the tree URIs returned by
    // ACTION_OPEN_DOCUMENT_TREE. Android 11+ cannot write a user-picked folder
    // through java.io.File, so downloads are published with ContentResolver.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // registerForActivityResult (ActivityResultLauncher) for the folder picker.
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // JVM unit tests for the pure SAF naming rules (no device required).
    testImplementation 'junit:junit:4.13.2'

    // Media3 / ExoPlayer - native Android playback path for NewPipe streams
    def media3Version = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // Google Cast — sends a single progressive/HLS URL to a receiver.
    // Guarded at runtime: devices without Play Services simply hide the button.
    implementation "androidx.media3:media3-cast:$media3Version"
    implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    // MediaRouteChooserDialog (used for the Cast device picker) extends
    // AppCompatDialog, so mediarouter needs appcompat on the classpath even
    // though the rest of the app has no AppCompat activities.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
