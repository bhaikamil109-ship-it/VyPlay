org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2048m -XX:-UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
kotlin.jvm.target.validation.mode=IGNORE
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# --- Build fixes (see VYPLAY_PROGRESS.md, Round 4) ---
# AGP auto-downloads the NDK (~2.5 GB) to strip native libraries out of plugin
# AARs. This project compiles no native code of its own and stripping is
# disabled in app/build.gradle, so that download is not wanted here. Remove this
# line if you re-enable stripping and want AGP to fetch the NDK for you.
android.builder.sdkDownload=false
# Flutter's Gradle plugin writes defaultConfig.ndk.abiFilters
# (armeabi-v7a,arm64-v8a,x86_64). AGP refuses to have both abiFilters and
# splits.abi configured, so the per-ABI splits block in app/build.gradle could
# never build. This is the plugin's own switch for skipping that write, leaving
# the splits block in charge of ABI selection.
disable-abi-filtering=true
