# Memory budget is deliberately small: this sandbox caps the whole container at
# 2 GB (cgroup memory.max), and the default -Xmx4096m made the Gradle daemon get
# OOM-killed mid-build. These values keep Gradle + Kotlin + AAPT2 inside the cap.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
# Run the Kotlin compiler inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.enableResourceOptimizations=false
org.gradle.caching=true
# Never let AGP auto-download SDK components. Without this, AGP tries to fetch
# the NDK (~2.5 GB) during configuration just to strip native libraries, which
# fails on a disk-constrained machine. Stripping is already disabled in
# android/build.gradle, so the NDK is not needed at all.
android.builder.sdkDownload=false
# Flutter's Gradle plugin sets defaultConfig.ndk.abiFilters to
# armeabi-v7a,arm64-v8a,x86_64. AGP refuses to have both abiFilters and
# splits.abi configured, so the app's per-ABI splits block could never build.
# This property is the plugin's own documented switch for skipping that
# abiFilters write; the splits block in app/build.gradle then owns ABI
# selection, which is what we want for per-ABI APKs.
disable-abi-filtering=true
android.useAndroidX=true
# Jetifier is not needed: no android.support.* dependency exists in this project.
android.enableJetifier=false
kotlin.jvm.target.validation.mode=IGNORE
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
