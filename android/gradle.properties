org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:-UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
kotlin.jvm.target.validation.mode=IGNORE
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# --- Build fixes (see VYPLAY_PROGRESS.md, Round 7) ---
# Heap was 4096m here plus 2048m for the Kotlin daemon. On a 7 GB GitHub
# runner that is 6 GB before Jetifier, the Kotlin compiler and the Dart
# toolchain have taken anything, and the Gradle daemon gets killed part-way
# through a native-library-heavy build. 3072m + 1536m leaves real headroom
# and is comfortably enough for this module graph.
#
# `disable-abi-filtering=true` was removed: it only existed to stop the
# Flutter plugin writing defaultConfig.ndk.abiFilters next to the Gradle
# `splits` block. That block is gone (splitting is now driven by
# `flutter build apk --split-per-abi`), so the plugin's default filters are
# wanted again.
#
# `android.builder.sdkDownload=false` is kept: this project compiles no native
# code of its own, so AGP should not fetch an NDK just to strip symbols.
android.builder.sdkDownload=false
