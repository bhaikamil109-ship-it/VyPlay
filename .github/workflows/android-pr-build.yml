name: Android PR Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apks:
    name: Build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1536m,-XX:-UseParallelGC"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root not found." >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'platforms;android-35' \
            'build-tools;36.0.0'

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build split-ABI debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK outputs and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-debug.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "No split-ABI debug APKs were produced." >&2
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            test -s "$apk"
            echo "APK: $(basename "$apk") ($(stat -c '%s' "$apk") bytes)"
            native_count="$(unzip -Z1 "$apk" | grep -Ec '^lib/[^/]+/[^/]+\.so$' || true)"
            if [[ "$native_count" -eq 0 ]]; then
              echo "No native libraries were packaged in $(basename "$apk")." >&2
              exit 1
            fi
            echo "Bundled native libraries: $native_count"
            unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+\.so$' | sort
          done

      - name: Upload debug APKs for review
        uses: actions/upload-artifact@v4
        with:
          name: vyplay-pr-debug-apks
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7
