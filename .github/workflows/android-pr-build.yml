name: Android PR Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apks:
    name: Build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1g"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root not found." >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'platforms;android-35' \
            'build-tools;36.0.0'

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Configure Gradle memory for CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvm.options=-Xmx1g
          EOF

      - name: Build split-ABI debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK outputs and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-debug.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "No split-ABI debug APKs were produced." >&2
            exit 1
          fi
          if [[ "${#APKS[@]}" -ne 3 ]]; then
            echo "Expected exactly three split-ABI APKs; found ${#APKS[@]}." >&2
            exit 1
          fi

          declare -A SEEN_ABIS=()
          for apk in "${APKS[@]}"; do
            test -s "$apk"
            apk_name="$(basename "$apk")"
            abi="${apk_name#app-}"
            abi="${abi%-debug.apk}"
            echo "APK: $apk_name ($(stat -c '%s' "$apk") bytes)"
            SEEN_ABIS["$abi"]=1

            case "$abi" in
              arm64-v8a|x86_64)
                expected_ffmpeg_libs=(
                  libffmpegkit.so
                  libffmpegkit_abidetect.so
                  libavcodec.so
                  libavdevice.so
                  libavfilter.so
                  libavformat.so
                  libavutil.so
                  libswresample.so
                  libswscale.so
                )
                ;;
              armeabi-v7a)
                expected_ffmpeg_libs=(
                  libffmpegkit_armv7a_neon.so
                  libffmpegkit_abidetect.so
                  libavcodec_neon.so
                  libavdevice_neon.so
                  libavfilter_neon.so
                  libavformat_neon.so
                  libavutil_neon.so
                  libswresample_neon.so
                  libswscale_neon.so
                )
                ;;
              *)
                echo "Unexpected ABI APK: $apk_name" >&2
                exit 1
                ;;
            esac

            apk_entries="$(unzip -Z1 "$apk")"
            for library in "${expected_ffmpeg_libs[@]}"; do
              if ! grep -Fxq "lib/$abi/$library" <<< "$apk_entries"; then
                echo "Missing FFmpeg library in $apk_name: lib/$abi/$library" >&2
                exit 1
              fi
            done

            echo "Verified FFmpeg libraries for $abi:"
            printf '  %s\n' "${expected_ffmpeg_libs[@]}"
          done

          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [[ -z "${SEEN_ABIS[$abi]:-}" ]]; then
              echo "Missing split-ABI APK for $abi." >&2
              exit 1
            fi
          done

      - name: Upload debug APKs for review
        uses: actions/upload-artifact@v4
        with:
          name: vyplay-pr-debug-apks
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7
