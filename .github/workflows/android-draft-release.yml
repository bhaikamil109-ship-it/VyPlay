
name: Android APK Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyplay-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build APKs and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1536m,-XX:-UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            2>/dev/null || true

          sudo apt-get clean

          echo "Disk after:"
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'platforms;android-35' \
            'build-tools;36.0.0'

      - name: Configure Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          if [[ -n "$ANDROID_KEYSTORE_BASE64" &&
                -n "$ANDROID_KEYSTORE_PASSWORD" &&
                -n "$ANDROID_KEY_PASSWORD" &&
                -n "$ANDROID_KEY_ALIAS" ]]; then

            echo "Using configured release keystore."

            printf '%s' "$ANDROID_KEYSTORE_BASE64" \
              | base64 --decode > android/app/key.jks

            {
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'storeFile=key.jks\n'
            } > android/key.properties

            echo "signed=true" >> "$GITHUB_OUTPUT"

          else
            echo "Release secrets unavailable."
            echo "Generating temporary debug keystore."

            keytool -genkeypair -v \
              -keystore android/app/key.jks \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            {
              printf 'storePassword=android\n'
              printf 'keyPassword=android\n'
              printf 'keyAlias=androiddebugkey\n'
              printf 'storeFile=key.jks\n'
            } > android/key.properties

            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          chmod 600 android/key.properties android/app/key.jks

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Save universal APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/VyPlay-universal.apk

          test -s dist/VyPlay-universal.apk

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect and verify APK files
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="build/app/outputs/flutter-apk"

          shopt -s nullglob
          SPLIT_APKS=("$APK_DIR"/app-*-release.apk)

          if (( ${#SPLIT_APKS[@]} == 0 )); then
            echo "No split APKs were generated."
            exit 1
          fi

          for apk in "${SPLIT_APKS[@]}"; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/VyPlay-${abi}.apk"
          done

          APK_COUNT="$(find dist -maxdepth 1 -name '*.apk' | wc -l)"

          if [[ "$APK_COUNT" -lt 2 ]]; then
            echo "Expected universal and split APKs."
            exit 1
          fi

          echo "Generated APKs:"
          ls -lh dist/*.apk

          for apk in dist/*.apk; do
            test -s "$apk"
          done

          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          match = re.search(
              r'^version:\s*(\S+)',
              Path('pubspec.yaml').read_text(),
              re.M
          )

          if not match:
              raise SystemExit('Version not found in pubspec.yaml')

          print(match.group(1))
          PY
          )"

          RELEASE_VERSION="${VERSION//+/-}"
          TAG="v${RELEASE_VERSION}-run-${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "VyPlay Android APK build."
            echo
            echo "Version: $VERSION"

            if [[ "$SIGNED" == "true" ]]; then
              echo "Signing: Configured release keystore."
            else
              echo "Signing: Temporary debug keystore."
              echo "For testing only. Future updates require the same signing key."
            fi

            echo
            echo "APK files:"
            find dist -maxdepth 1 -name '*.apk' -printf '- %f\n' | sort

            echo
            echo "Recent changes:"
            git log --pretty='- %s (%h)' -10
          } > RELEASE_NOTES.md

      - name: Publish APKs directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app_version.outputs.tag }}
          VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/*.apk \
            dist/SHA256SUMS \
            --title "VyPlay $VERSION" \
            --notes-file RELEASE_NOTES.md

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/vyplay-release-check"
          mkdir -p "$DOWNLOAD_DIR"

          gh release download "$RELEASE_TAG" \
            --dir "$DOWNLOAD_DIR"

          for apk in dist/*.apk; do
            name="$(basename "$apk")"
            cmp "$apk" "$DOWNLOAD_DIR/$name"
            echo "Verified: $name"
          done

          cmp dist/SHA256SUMS "$DOWNLOAD_DIR/SHA256SUMS"

          (
            cd "$DOWNLOAD_DIR"
            sha256sum --check SHA256SUMS
          )

          echo "All published APK assets verified."

      - name: Build summary
        if: always()
        run: |
          echo "## VyPlay APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "Flutter tests: Not run." >> "$GITHUB_STEP_SUMMARY"
          echo "Flutter analyze: Not run." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions artifact upload: Disabled." >> "$GITHUB_STEP_SUMMARY"
          
