name: Android APK Build & Release

# Builds installable APKs on every push to main and attaches them to a GitHub
# Release.
#
# Signing is optional on purpose. When the ANDROID_* secrets are present the
# APKs are signed with the real release keystore. When they are absent the
# workflow generates a throwaway debug keystore so the build still succeeds and
# still produces installable APKs. That is what makes this workflow green on a
# fresh clone with no secrets configured.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build APKs and publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1536m,-XX:-UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            2>/dev/null || true
          sudo apt-get clean
          echo "Disk after:"; df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      # android/gradle.properties sets `android.builder.sdkDownload=false`, which
      # stops AGP from fetching missing SDK components on its own, so every
      # platform and build-tools the build needs must be installed up front.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set." >&2
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found in ${SDK_ROOT}/cmdline-tools or on PATH." >&2
            exit 1
          fi
          echo "sdkmanager: ${SDKMANAGER}"

          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true

          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

          echo "--- installed platforms ---"
          ls "${SDK_ROOT}/platforms"
          echo "--- installed build-tools ---"
          ls "${SDK_ROOT}/build-tools"

      # Real release signing when the secrets exist; otherwise a generated debug
      # keystore so the release build can still run. android/app/build.gradle
      # fails fast when a release build has no keystore, so one must always be
      # present.
      - name: Configure signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" ]]; then
            echo "Using the release keystore from repository secrets."
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/key.jks
            {
              printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
              printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
              printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
              printf 'storeFile=key.jks\n'
            } > android/key.properties
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No release keystore secrets found - generating a throwaway debug keystore."
            keytool -genkeypair -v \
              -keystore android/app/key.jks \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              printf 'storePassword=android\n'
              printf 'keyPassword=android\n'
              printf 'keyAlias=androiddebugkey\n'
              printf 'storeFile=key.jks\n'
            } > android/key.properties
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Split-per-abi is Flutter's own flag. It produces
      # app-armeabi-v7a-release.apk and app-arm64-v8a-release.apk under
      # build/app/outputs/flutter-apk/ with exactly the names the tool expects.
      # Doing this from a Gradle `splits` block instead used to suppress the
      # default app-release.apk and make the whole build report
      # "Gradle build failed to produce an .apk file".
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lah dist

      - name: Show Gradle failure details
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== apk files ==="
          find build -maxdepth 5 -name '*.apk' 2>/dev/null | head -50
          echo "=== outputs ==="
          ls -laR build/app/outputs 2>/dev/null | head -80

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          tag="v${version//+/-}-run-${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Automated Android build for ${GITHUB_SHA}."
            echo
            if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
              echo "Signing: release keystore (repository secrets)."
            else
              echo "Signing: **debug keystore** - these APKs are for testing only and cannot be uploaded to Google Play."
            fi
            echo
            echo "Included APKs:"
            find dist -maxdepth 1 -name '*.apk' -printf "- %f\n" | sort
            echo
            echo "Recent changes:"
            git log --pretty='- %s (%h)' -20
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.app_version.outputs.tag }}" dist/*.apk \
            --title "VyPlay ${{ steps.app_version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
