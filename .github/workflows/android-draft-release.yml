
name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, e.g. v0.9.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vyplay-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Publish VyPlay APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ANDROID_PACKAGE_ID: com.kamil.vyplay
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and select source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG. Expected vX.Y.Z."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"

            if [[ -n "$REMOTE_TAG" ]]; then
              git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              git checkout --detach "$RELEASE_TAG"
              echo "Using existing tag: $RELEASE_TAG"
            else
              echo "Tag does not exist. Building current main commit."
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Validate version and configure signing
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("pubspec.yaml").read_text()
          match = re.search(
              r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$",
              text, re.M
          )
          if not match:
              raise SystemExit("Expected pubspec version format x.y.z+n")
          print(match.group(1))
          PY
          )"

          BUILD_NUMBER="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("pubspec.yaml").read_text()
          match = re.search(
              r"^version:\s*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)\s*$",
              text, re.M
          )
          if not match:
              raise SystemExit("Build number not found")
          print(match.group(1))
          PY
          )"

          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match pubspec version v$VERSION."
            exit 1
          fi

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_RELEASE_CERT_SHA256
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: $name"
              exit 1
            fi
          done

          EXPECTED_CERT="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid certificate SHA-256 fingerprint."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/vyplay-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          CERT_FILE="$RUNNER_TEMP/release-cert.der"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$CERT_FILE"

          ACTUAL_CERT="$(sha256sum "$CERT_FILE" | cut -d ' ' -f1)"

          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "Signing certificate fingerprint mismatch."
            exit 1
          fi

          mkdir -p android/app

          cp "$KEYSTORE" android/app/key.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=key.jks\n'
          } > android/key.properties

          chmod 600 android/key.properties android/app/key.jks

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "certificate=$ACTUAL_CERT" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'platforms;android-35' \
            'build-tools;36.0.0'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --build-name='${{ steps.metadata.outputs.version }}' \
            --build-number='${{ steps.metadata.outputs.build_number }}'

      - name: Preserve universal APK
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/vyplay-release-assets"
          mkdir -p "$RELEASE_DIR"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RELEASE_DIR/VyPlay-${RELEASE_TAG}-universal.apk"

          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name='${{ steps.metadata.outputs.version }}' \
            --build-number='${{ steps.metadata.outputs.build_number }}'

      - name: Verify APKs and generate checksums
        shell: bash
        env:
          EXPECTED_CERT: ${{ steps.metadata.outputs.certificate }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail

          APK_DIR="build/app/outputs/flutter-apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"

          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          shopt -s nullglob
          SPLIT_APKS=("$APK_DIR"/app-*-release.apk)

          if (( ${#SPLIT_APKS[@]} == 0 )); then
            echo "No split APKs were generated."
            exit 1
          fi

          for apk in "${SPLIT_APKS[@]}"; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "$RELEASE_DIR/VyPlay-${RELEASE_TAG}-${abi}.apk"
          done

          : > "$RELEASE_DIR/SHA256SUMS"

          for apk in "$RELEASE_DIR"/*.apk; do
            test -s "$apk"

            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" \
              > "$RUNNER_TEMP/apksigner.log"

            CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {
              gsub(/:/, "", $2); print tolower($2); exit
            }' "$RUNNER_TEMP/apksigner.log")"

            if [[ "$CERT" != "$EXPECTED_CERT" ]]; then
              echo "APK signing certificate mismatch: $(basename "$apk")"
              exit 1
            fi

            BADGING="$("$BUILD_TOOLS/aapt" dump badging "$apk")"

            grep -F "package: name='$ANDROID_PACKAGE_ID' versionCode='$BUILD_NUMBER' versionName='$VERSION'" <<< "$BADGING" >/dev/null || {
              echo "Package ID or version mismatch: $(basename "$apk")"
              exit 1
            }

            (cd "$RELEASE_DIR" && sha256sum "$(basename "$apk")" >> SHA256SUMS)

            echo "Verified: $(basename "$apk")"
          done

          (cd "$RELEASE_DIR" && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Updating its APK assets."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "VyPlay $RELEASE_TAG" \
              --generate-notes
          fi

          for apk in "$RELEASE_DIR"/*.apk; do
            gh release upload "$RELEASE_TAG" "$apk" --clobber
          done

          gh release upload "$RELEASE_TAG" \
            "$RELEASE_DIR/SHA256SUMS" --clobber

      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/vyplay-download-check"
          mkdir -p "$DOWNLOAD_DIR"

          for asset in "$RELEASE_DIR"/*.apk "$RELEASE_DIR/SHA256SUMS"; do
            name="$(basename "$asset")"

            gh release download "$RELEASE_TAG" \
              --pattern "$name" \
              --dir "$DOWNLOAD_DIR"

            cmp "$asset" "$DOWNLOAD_DIR/$name"
            echo "Release asset verified: $name"
          done

          (cd "$DOWNLOAD_DIR" && sha256sum --check SHA256SUMS)

      - name: Release summary
        shell: bash
        run: |
          echo "## VyPlay APK Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Flutter tests and analyzer were not run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK assets uploaded and verified on GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          
