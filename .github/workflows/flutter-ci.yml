name: Flutter CI

# Continuous verification for every change to main: static analysis, the full
# unit/widget test suite, and a debug APK build. The debug build is the part
# that cannot run in a disk-constrained sandbox, so CI is where it gets proven.
#
# Release builds are deliberately NOT here: they need the signing keystore,
# which lives in repository secrets and is handled by android-draft-release.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. It uploads build
# artifacts through the Actions runtime, which does not need contents: write.
permissions:
  contents: read

# One run per branch. A new push supersedes the previous run instead of queueing
# behind it, so a stale commit never holds the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.14.5 + AGP 8.13.2 require a JDK 17 toolchain. The runner's
      # default JDK is not guaranteed to be 17, so it is pinned explicitly.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3.47.1 matches the version android-draft-release.yml already pins, so
      # both workflows build with the same toolchain.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Flutter version
        run: flutter --version

      # Informational only: a missing optional component must not fail the job.
      - name: Flutter doctor
        run: flutter doctor -v || true

      # android/gradle.properties sets `android.builder.sdkDownload=false`, which
      # stops AGP from fetching missing SDK components on its own. That is what
      # keeps the NDK (~2.5 GB) out of the build, but it also means every
      # platform/build-tools the build needs must be installed up front.
      # compileSdk comes from flutter.compileSdkVersion (36 on this Flutter
      # version) and targetSdk is 35, so both platforms are installed.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set." >&2
            exit 1
          fi
          echo "Android SDK root: ${SDK_ROOT}"

          # Prefer the newest cmdline-tools copy; fall back to whatever
          # sdkmanager is already on PATH if the directory layout differs.
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found in ${SDK_ROOT}/cmdline-tools or on PATH." >&2
            exit 1
          fi
          echo "sdkmanager: ${SDKMANAGER}"

          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true

          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

          echo "--- installed platforms ---"
          ls "${SDK_ROOT}/platforms"
          echo "--- installed build-tools ---"
          ls "${SDK_ROOT}/build-tools"

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos keeps style-level infos from failing CI while still
      # failing on warnings and errors.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # Per-ABI splits are enabled in android/app/build.gradle, so this produces
      # app-armeabi-v7a-debug.apk and app-arm64-v8a-debug.apk rather than a
      # single app-debug.apk. The artifact glob below covers both shapes.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: List built APKs
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: vyplay-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error
